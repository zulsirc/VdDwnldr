<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Imunologia — Prova 7 Aulas</title>
<style>
html,body{margin:0;min-height:100%;background:#0f172a;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center}.box{max-width:560px;padding:32px;text-align:center}h1{font-size:clamp(26px,7vw,42px);margin:0 0 18px}.status{font-size:18px;color:#94a3b8;line-height:1.5}.err{color:#fca5a5;white-space:pre-wrap}.spin{width:34px;height:34px;margin:24px auto;border:4px solid #334155;border-top-color:#e5e7eb;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><h1>Imunologia</h1><div class="spin"></div><div id="status" class="status">Carregando o curso completo…</div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
   const url='https://pumhrdzmpevjraenzzyf.supabase.co/functions/v1/imuno-study?v=2';
   const r=await fetch(url,{cache:'no-store'});
   if(!r.ok) throw new Error('Servidor respondeu HTTP '+r.status);
   const html=await r.text();
   if(html.length<150000||!/^\s*<!doctype html>/i.test(html)) throw new Error('Conteúdo recebido incompleto ('+html.length+' caracteres).');
   status.textContent='Abrindo o curso…';
   document.open();
   document.write(html);
   document.close();
 }catch(e){
   document.querySelector('.spin')?.remove();
   status.className='status err';
   status.textContent='Não foi possível abrir o curso.\n'+(e&&e.message?e.message:String(e));
 }
})();
</script>
</body>
</html>
